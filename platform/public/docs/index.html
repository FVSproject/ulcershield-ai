<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UlcerShield AI · Documentation</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #030b16 0%, #0b1e33 50%, #0e3252 100%);
    color: #e8f3ff;
    display: grid;
    place-items: center;
    padding: 40px;
  }
  .wrap { max-width: 640px; text-align: center; }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #22d3ee, #0891b2);
    color: white;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 999px;
    font-weight: 700;
    margin-bottom: 20px;
  }
  h1 { font-size: 42px; margin: 0 0 12px; letter-spacing: -0.02em; }
  p.lede { color: #9ab6d6; font-size: 16px; max-width: 480px; margin: 0 auto 40px; line-height: 1.55; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 620px) { .cards { grid-template-columns: 1fr; } }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(11,30,51,0.55);
    border: 1px solid rgba(56,189,248,0.15);
    padding: 24px;
    border-radius: 16px;
    backdrop-filter: blur(24px);
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  a.card:hover {
    transform: translateY(-3px);
    border-color: rgba(56,189,248,0.45);
    box-shadow: 0 20px 60px -20px rgba(6,182,212,0.4);
  }
  .flag { font-size: 32px; margin-bottom: 10px; }
  .card h2 { font-size: 18px; margin: 0 0 4px; }
  .card p { font-size: 13px; color: #9ab6d6; margin: 0; }
  footer { margin-top: 40px; font-size: 12px; color: #6b8ba8; }
  footer a { color: #67e8f9; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">UlcerShield AI · Documentation</span>
  <h1>User Guide</h1>
  <p class="lede">Complete feature-by-feature reference. Pick your language — each guide is a single HTML page you can print to PDF.</p>

  <div class="cards">
    <a class="card" href="./user-guide-en.html">
      <div class="flag">🇬🇧</div>
      <h2>English</h2>
      <p>Full user guide · 20 sections · Print-ready</p>
    </a>
    <a class="card" href="./user-guide-ar.html" lang="ar" dir="rtl">
      <div class="flag">🇸🇦</div>
      <h2>العربية</h2>
      <p>دليل المستخدم الكامل · <span dir="ltr">20</span> قسماً · جاهز للطباعة</p>
    </a>
  </div>

  <footer>
    <a href="/">← Back to platform</a>
  </footer>
</div>
</body>
</html>
